<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f5">
<title>みほはくん＆みあなちゃんニュース</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;background:#f5f5f5;color:#222}
  a{display:inline-block;margin-bottom:16px}
  main{white-space:pre-wrap;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px #0001}
  .comment-section{margin-top:28px;padding:24px;background:#fff;border-radius:12px;box-shadow:0 2px 10px #0001}
  .comment-section h2{margin-top:0}
  .privacy-note{padding:12px 14px;background:#f1f5f9;border-radius:8px;line-height:1.7}
  form label{display:block;margin:16px 0 6px;font-weight:650}
  input,textarea{display:block;width:100%;padding:11px 12px;border:1px solid #b8c0cc;border-radius:8px;font:inherit;background:#fff;color:#222}
  textarea{resize:vertical;min-height:140px}
  input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
  .hint{font-size:.9rem;color:#555;margin:6px 0}
  .submit-button{margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:#1d4ed8;color:white;font:inherit;font-weight:700;cursor:pointer}
  .submit-button:disabled{opacity:.65;cursor:wait}
  #commentStatus{min-height:1.6em;line-height:1.6}
  .comment-honeypot{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
  footer{margin:24px 0 8px;font-size:.85rem;color:#666}
  @media(max-width:520px){body{padding:14px}.comment-section,main{padding:18px}}
</style>
</head>
<body>
<a href="history.html">履歴を見る</a>
<h1>最新ニュース</h1>
<main id="output">読み込み中...</main>

<section class="comment-section" aria-labelledby="comment-heading">
  <h2 id="comment-heading">MHNへのコメント</h2>
  <p>ご意見・感想・不具合報告などを送れます。</p>
  <p class="privacy-note"><strong>非公開です。</strong>送信したコメントはホームページに表示されず、運営だけが確認します。氏名・住所・電話番号・メールアドレス・パスワードなどの個人情報は入力しないでください。返信できない場合もあります。</p>
  <form id="commentForm">
    <label for="commentNickname">ニックネーム（任意・40文字まで）</label>
    <input id="commentNickname" name="nickname" type="text" maxlength="40" autocomplete="nickname">
    <p class="hint">本名ではなく、公開しても問題のない名前を使ってください。</p>

    <label for="commentMessage">コメント（必須・2,000文字まで）</label>
    <textarea id="commentMessage" name="message" maxlength="2000" required aria-describedby="commentMessageHint"></textarea>
    <p id="commentMessageHint" class="hint">コメントは公開されません。送信前に内容を確認してください。</p>

    <div class="comment-honeypot" aria-hidden="true">
      <label for="commentWebsite">この欄は入力しないでください</label>
      <input id="commentWebsite" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <button class="submit-button" id="commentSubmit" type="submit">運営に非公開で送信</button>
    <p id="commentStatus" role="status" aria-live="polite"></p>
  </form>
</section>

<footer>MHN — みほはくん＆みあなちゃんのニュースタイム</footer>
<script>
  const script=document.createElement('script');
  script.src='app.js?v='+Date.now();
  script.async=false;
  document.body.appendChild(script);
</script>
<script src="comments.js?v=1"></script>
</body>
</html>
