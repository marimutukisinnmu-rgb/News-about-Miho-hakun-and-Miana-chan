<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ニュース</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;background:#f5f5f5;color:#222}main{white-space:pre-wrap;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px #0001}a{display:inline-block;margin-bottom:16px}</style></head>
<body><a href="history.html">← 履歴に戻る</a><main id="output">読み込み中...</main><script>
const base='https://raw.githubusercontent.com/marimutukisinnmu-rgb/News-about-Miho-hakun-and-Miana-chan/web/ai/logs/';
const log=new URLSearchParams(location.search).get('log');
if(!log||log.includes('/')||log.includes('\\')){output.textContent='ログ指定が不正です。'}else{fetch(base+encodeURIComponent(log)).then(r=>{if(!r.ok)throw Error();return r.text()}).then(t=>output.textContent=t).catch(e=>output.textContent='ニュースの取得に失敗しました。')}
</script></body></html>
