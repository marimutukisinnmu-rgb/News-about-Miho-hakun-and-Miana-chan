<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f5">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://ewiurxmmomtcjfvjfpus.supabase.co; form-action 'self';">
<title>MHN パスワード再設定</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:620px;margin:0 auto;padding:22px;background:#f5f5f5;color:#222;line-height:1.6}a{color:#1d4ed8}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 10px #0001;margin-top:18px}h1{font-size:1.7rem;margin:.5rem 0}p{margin:.6rem 0}.muted{color:#555;font-size:.92rem}.field{margin:14px 0}.field label{display:block;font-weight:650;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #b8c0cc;border-radius:8px;font:inherit}button{padding:11px 14px;border:0;border-radius:8px;font:inherit;font-weight:650;cursor:pointer}.primary{background:#1d4ed8;color:white;width:100%;margin-top:10px}button:disabled{opacity:.6;cursor:wait}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:2px} [hidden]{display:none!important} .status{min-height:3em;white-space:pre-wrap}
@media(max-width:480px){body{padding:14px}.card{padding:18px}}
</style>
</head>
<body>
<nav data-mhn-nav aria-label="サイトメニュー"><a href="index.html">最新ニュース</a> <a href="history.html">履歴を見る</a></nav>
<a href="./auth.html">← ログイン画面へ戻る</a>
<header><h1>パスワードを再設定</h1><p>登録したメールアドレスに再設定用リンクを送信します。</p></header>
<section class="card" id="requestPanel">
  <form id="resetRequestForm">
    <div class="field"><label for="resetEmail">メールアドレス</label><input id="resetEmail" name="email" type="email" maxlength="254" autocomplete="email" required></div>
    <button class="primary" id="requestButton" type="submit">再設定メールを送信</button>
  </form>
  <p class="muted">メールが届かない場合は、迷惑メールフォルダーも確認してください。</p>
  <p class="status" id="requestStatus" role="status" aria-live="polite"></p>
</section>
<section class="card" id="changePanel" hidden>
  <h2>新しいパスワード</h2>
  <p class="muted">新しいパスワードを8文字以上で入力してください。</p>
  <form id="changePasswordForm">
    <div class="field"><label for="newPassword">新しいパスワード</label><input id="newPassword" name="newPassword" type="password" minlength="8" autocomplete="new-password" required></div>
    <div class="field"><label for="confirmPassword">新しいパスワード（確認）</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
    <button class="primary" id="updateButton" type="submit">パスワードを更新</button>
  </form>
  <p class="status" id="changeStatus" role="status" aria-live="polite"></p>
</section>
<section class="card" id="donePanel" hidden>
  <h2>パスワードを更新しました</h2>
  <p>新しいパスワードでログインしてください。</p>
  <a href="./auth.html">MHNのログイン画面へ</a>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js" defer></script>
<script src="./nav.js?v=3" defer></script>
<script src="./reset-password.js?v=1" defer></script>
</body>
</html>
