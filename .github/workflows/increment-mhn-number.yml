name: Increment MHN number on new log

on:
  push:
    branches:
      - main
    paths:
      - 'ai/logs/*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhn-number-update
  cancel-in-progress: false

jobs:
  increment-number:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Count newly added MHN logs
        id: logs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COUNT=0
            echo "Manual run: no automatic increment (log push is the trigger for +1)."
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              COUNT=$(git diff-tree --no-commit-id --name-status -r "$AFTER" -- 'ai/logs/*.txt' | awk '$1 == "A" {count++} END {print count+0}')
            else
              COUNT=$(git diff --name-status "$BEFORE" "$AFTER" -- 'ai/logs/*.txt' | awk '$1 == "A" {count++} END {print count+0}')
            fi
          fi

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "New MHN logs: $COUNT"

      - name: Increment number.txt
        if: steps.logs.outputs.count != '0'
        shell: bash
        run: |
          COUNT="${{ steps.logs.outputs.count }}"
          FILE="ai/number.txt"

          CURRENT=$(tr -d '\r\n ' < "$FILE")
          if [[ ! "$CURRENT" =~ ^#([0-9]+)$ ]]; then
            echo "Invalid number.txt: $CURRENT"
            exit 1
          fi

          NUMBER="${BASH_REMATCH[1]}"
          NEW_NUMBER=$((NUMBER + COUNT))
          printf '#%s\n' "$NEW_NUMBER" > "$FILE"

          echo "number.txt: $CURRENT -> #$NEW_NUMBER"

      - name: Generate website log indexes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          name_re = re.compile(r'^#(\d+) (\d{4}-\d{2}-\d{2}-\d{2}:\d{2})\.txt$')
          records = []
          for path in Path("ai/logs").glob("*.txt"):
              match = name_re.fullmatch(path.name)
              if not match:
                  continue
              text = path.read_text(encoding="utf-8")
              records.append({
                  "name": path.name,
                  "number": int(match.group(1)),
                  "date": match.group(2),
                  "text": text,
              })

          records.sort(key=lambda item: (item["date"], item["number"]), reverse=True)
          metadata = {
              "logs": [
                  {"name": item["name"], "number": item["number"], "date": item["date"]}
                  for item in records
              ]
          }
          search = {
              "logs": [
                  {"name": item["name"], "text": item["text"]}
                  for item in records
              ]
          }

          Path("ai/log-index.json").write_text(
              json.dumps(metadata, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          Path("ai/log-search-index.json").write_text(
              json.dumps(search, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          print(f"Generated website indexes for {len(records)} news logs.")
          PY

      - name: Commit number and website indexes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/number.txt ai/log-index.json ai/log-search-index.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update MHN number and news indexes"
          git push
