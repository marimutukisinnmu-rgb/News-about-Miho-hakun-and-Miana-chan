name: Increment MHN number on new log

on:
  push:
    branches:
      - main
    paths:
      - 'ai/logs/*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhn-number-update
  cancel-in-progress: false

jobs:
  increment-number:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Count newly added MHN logs
        id: logs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COUNT=0
            echo "Manual run: no automatic increment (log push is the trigger for +1)."
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              COUNT=$(git diff-tree --no-commit-id --name-status -r "$AFTER" -- 'ai/logs/*.txt' | awk '$1 == "A" {count++} END {print count+0}')
            else
              COUNT=$(git diff --name-status "$BEFORE" "$AFTER" -- 'ai/logs/*.txt' | awk '$1 == "A" {count++} END {print count+0}')
            fi
          fi

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "New MHN logs: $COUNT"

      - name: Increment number.txt
        if: steps.logs.outputs.count != '0'
        shell: bash
        run: |
          COUNT="${{ steps.logs.outputs.count }}"
          FILE="ai/number.txt"

          CURRENT=$(tr -d '\r\n ' < "$FILE")
          if [[ ! "$CURRENT" =~ ^#([0-9]+)$ ]]; then
            echo "Invalid number.txt: $CURRENT"
            exit 1
          fi

          NUMBER="${BASH_REMATCH[1]}"
          NEW_NUMBER=$((NUMBER + COUNT))
          printf '#%s\n' "$NEW_NUMBER" > "$FILE"

          echo "number.txt: $CURRENT -> #$NEW_NUMBER"

      - name: Commit number update
        if: steps.logs.outputs.count != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/number.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: increment MHN number for new log"
          git push
