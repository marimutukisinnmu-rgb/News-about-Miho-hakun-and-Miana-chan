<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ニュース履歴</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;background:#f5f5f5;color:#222}ul{list-style:none;padding:0}li{background:#fff;margin:8px 0;padding:14px;border-radius:10px}a{text-decoration:none}.title-row{display:flex;align-items:center;gap:10px}.search-btn{border:0;background:transparent;font-size:22px;cursor:pointer;padding:2px 6px}.search-box{display:none;margin:12px 0}.search-box input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px}</style></head>
<body><a href="index.html">← 最新ニュース</a><div class="title-row"><h1>ニュース履歴</h1><button id="searchBtn" class="search-btn" aria-label="ニュースを検索" title="ニュースを検索">🔍</button></div><div id="searchBox" class="search-box"><input id="searchInput" type="search" placeholder="ニュースを検索（部分一致）" autocomplete="off"></div><ul id="list"><li>読み込み中...</li></ul><script>
const API='https://api.github.com/repos/marimutukisinnmu-rgb/News-about-Miho-hakun-and-Miana-chan/contents/ai/logs';
function newsNumber(name){const i=name.indexOf(' ');return Number(name.slice(1,i<0?name.length:i));}
function newsDate(name){const m=name.match(/^#\d+ (\d{4})-(\d{2})-(\d{2})-(\d{2}):(\d{2})\.txt$/);return m?m.slice(1).join(''):name;}
function displayName(name){const m=name.match(/^#(\d+) (\d{4})-(\d{2})-(\d{2})-(\d{2}):(\d{2})\.txt$/);return m?`${Number(m[1])}回目(${m[2]}/${m[3]}/${m[4]} ${m[5]}:${m[6]})`:name.replace(/\.txt$/i,'');}
function render(logs){list.innerHTML='';if(!logs.length){list.innerHTML='<li>該当するニュースがありません。</li>';return}for(const f of logs){const li=document.createElement('li');const a=document.createElement('a');a.href='historyoutput.html?log='+encodeURIComponent(f.name);a.textContent=displayName(f.name);li.appendChild(a);list.appendChild(li)}}
let logs=[];
async function load(){const r=await fetch(API+'?t='+Date.now());if(!r.ok)throw Error('取得失敗');const files=await r.json();logs=files.filter(x=>x.type==='file'&&x.name.endsWith('.txt')).sort((a,b)=>{const n=newsNumber(b.name)-newsNumber(a.name);return n||newsDate(b.name).localeCompare(newsDate(a.name));});await searchNow();}
async function searchNow(){const q=searchInput.value.trim().toLocaleLowerCase();if(!q){render(logs);return}const matched=[];for(const f of logs){try{const r=await fetch(f.download_url+'?t='+Date.now());const t=r.ok?await r.text():'';if((t+' '+displayName(f.name)).toLocaleLowerCase().includes(q))matched.push(f)}catch(e){}}render(matched)}
searchBtn.addEventListener('click',()=>{const open=searchBox.style.display==='block';searchBox.style.display=open?'none':'block';if(!open)searchInput.focus();else{searchInput.value='';render(logs)}});
searchInput.addEventListener('input',searchNow);
searchInput.addEventListener('keydown',async e=>{if(e.key==='Enter'){e.preventDefault();await load();}});
load().catch(e=>list.innerHTML='<li>履歴の取得に失敗しました。</li>');
</script></body></html>
